name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Catch newly-published query results even on weeks with no push/PR.
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust: rustlogger, rustmon, wasm_core_engine/core, mcp_server_generator.
          - language: rust
            build-mode: none
          # TypeScript/JS: rustlogger-mcp-server.
          - language: javascript-typescript
            build-mode: none
          # Lints the workflow YAML in this directory itself.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
