name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Build & test (workspace, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --workspace --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --verbose -- -D warnings

  rustlogger-windows:
    # rustlogger is the only workspace member with native Windows support
    # (ConPTY via portable-pty, console handling via the `windows` crate —
    # see rustlogger/Cargo.toml). rustmon is Linux-only by design (see
    # docs/rustmon-design.md) and fails to cross-compile for Windows, so it
    # is deliberately excluded here rather than run with `--workspace`.
    #
    # Build-only for now, deliberately NOT `cargo test`: the first time this
    # job actually ran `cargo test -p rustlogger` here, it hung and was
    # cancelled after 16+ minutes with no output (tests/session_end_to_end.rs
    # spawns a real ConPTY session, which had never executed on real Windows
    # before - see docs/TODO-rustlogger.md, chunk 9's 2026-09-23 update, for
    # what's suspected and what a fix needs to confirm). Re-add the test step
    # once that's diagnosed - don't just uncomment it and hope, it will hang
    # the job again.
    name: Build (rustlogger, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build -p rustlogger --verbose

  rustlogger-mcp-server:
    name: rustlogger-mcp-server (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustlogger-mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rustlogger-mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
